# Publicación automática de main validado; PUBLICAR_VISOR permite desactivarla.
name: Publicar visor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  construir:
    if: github.ref == 'refs/heads/main' && vars.PUBLICAR_VISOR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-extraccion.txt
      - run: python scripts/validar.py
      - run: python scripts/auditar_referencias.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/construir.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Comprobar que la versión sigue siendo main
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const current = branch.commit.sha === context.sha;
            core.setOutput('actual', String(current));
            if (!current) core.notice('Se omite una versión antigua; main ya tiene cambios posteriores.');
      - id: deploy
        if: steps.revision.outputs.actual == 'true'
        uses: actions/deploy-pages@v4
